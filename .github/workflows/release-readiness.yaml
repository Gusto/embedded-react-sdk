name: Release Readiness

on:
  workflow_run:
    workflows: [Release Readiness Events]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-readiness
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: gusto-ubuntu-default
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/release-readiness.cjs')
            await run({ github, context, core })
