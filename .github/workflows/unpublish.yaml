name: Unpublish an old NPM package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish'
        required: true
      dry_run:
        description: 'Validate only — run npm unpublish with --dry-run'
        required: false
        type: boolean
        default: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Deliberately no actions/cache here: this job holds NPM_TOKEN, and a
    # dispatch from any branch can write under a cache key keyed only on
    # lockfile hash or github.sha, which lands in main's cache scope and
    # would be restored here on a later run — i.e. a cache-poisoning path
    # into the job that publishes/unpublishes. See validate-release-workflows.sh.
    #
    # Every dispatch input is read into one of these env vars and validated
    # below before any step uses it — never reference
    # `${{ github.event.inputs.* }}` directly inside a `run:` script, since
    # Actions does literal string substitution into the shell before
    # execution, making it injectable. env: assignment itself is safe.
    env:
      UNPUBLISH_VERSION: ${{ github.event.inputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate inputs
        run: |
          .github/scripts/validate-release-input.sh semver "$UNPUBLISH_VERSION"
          .github/scripts/validate-release-input.sh boolean "${DRY_RUN:-false}"

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            npm unpublish "@gusto/embedded-react-sdk@$UNPUBLISH_VERSION" --dry-run
          else
            npm unpublish "@gusto/embedded-react-sdk@$UNPUBLISH_VERSION"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
