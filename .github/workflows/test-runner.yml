name: test-runner
on:
  push:
    branches: [test-claude-local-runner]
jobs:
  worker:
    runs-on: [self-hosted, serikjensen]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Full worker test (read-only task)
        env:
          PR: '2510'
        run: |
          ~/bin/claude-pr "$PR" "Summarize what this PR changes and whether it is rebased on origin/main. Do not modify, push, or comment on anything."
