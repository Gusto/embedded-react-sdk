# Reusable workflow: installs dependencies and builds the SDK for a given
# ref, so stable and RC publish run the exact same build steps and that
# logic lives in one place. Deliberately takes no secrets and requests
# only read permissions — this job runs npm ci/i18n:generate/vite build,
# which execute devDependency and plugin code, so NPM_TOKEN must never be
# reachable here. The caller's separate publish job downloads this job's
# `dist` artifact and never runs npm ci itself, keeping dependency/build
# code execution out of the runner that holds the token.
name: Build SDK
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to build'
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n translations
        run: npm run i18n:generate

      - name: Build
        run: npx vite build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
