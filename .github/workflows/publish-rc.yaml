name: Publish RC to NPM
on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: 'RC number (optional, will auto-increment if version exists)'
        required: false
        type: string
        default: '1'
      branch:
        description: 'Branch to release from'
        required: false
        type: string
        default: 'main'
      commit:
        description: 'Specific commit to release from (overrides branch if provided)'
        required: false
        type: string
      dry_run:
        description: 'Validate and build only — run npm publish with --dry-run'
        required: false
        type: boolean
        default: false
jobs:
  validate:
    runs-on:
      group: gusto-ubuntu-default
    permissions:
      contents: read
    # Every dispatch input is read into one of these env vars and validated
    # below before any step uses it — never reference
    # `${{ github.event.inputs.* }}` directly inside a `run:` script, since
    # Actions does literal string substitution into the shell before
    # execution, making it injectable. env: assignment itself is safe.
    env:
      INPUT_RC_NUMBER: ${{ github.event.inputs.rc_number }}
      INPUT_BRANCH: ${{ github.event.inputs.branch }}
      INPUT_COMMIT: ${{ github.event.inputs.commit }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
    outputs:
      # Pinned to a resolved commit SHA (see Resolve ref to commit SHA
      # below), not the branch/commit input verbatim — build and publish
      # run as separate jobs, minutes apart, and a branch name is mutable
      # in between. Checking out the same branch name twice could silently
      # build dist/ from one commit and publish package.json/CHANGELOG.md
      # from a later one if the branch moved in that window.
      ref: ${{ steps.resolve-ref.outputs.sha }}
      ref_type: ${{ steps.checkout-ref.outputs.ref_type }}
      ref_name: ${{ steps.checkout-ref.outputs.ref_name }}
      rc_number: ${{ env.INPUT_RC_NUMBER }}
      dry_run: ${{ env.INPUT_DRY_RUN }}
    steps:
      # This checkout is deliberate and intentionally untargeted: it pulls
      # validate-release-input.sh from the trusted dispatch ref (the ref
      # the workflow itself runs from), not from the untrusted
      # user-supplied branch/commit input, so the validator below can't be
      # swapped out by whatever is being released. Keep the Validate step
      # before the second (ref-targeted) checkout below.
      - uses: actions/checkout@v6

      - name: Validate inputs
        run: |
          RC_NUMBER="${INPUT_RC_NUMBER:-1}"
          .github/scripts/validate-release-input.sh rc-number "$RC_NUMBER"
          .github/scripts/validate-release-input.sh boolean "${INPUT_DRY_RUN:-false}"

          if [ -n "$INPUT_COMMIT" ]; then
            .github/scripts/validate-release-input.sh commit-sha "$INPUT_COMMIT"
          else
            .github/scripts/validate-release-input.sh branch-name "${INPUT_BRANCH:-main}"
          fi

      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ -n "$INPUT_COMMIT" ]; then
            echo "Using commit: $INPUT_COMMIT"
            echo "ref=$INPUT_COMMIT" >> "$GITHUB_OUTPUT"
            echo "ref_type=commit" >> "$GITHUB_OUTPUT"
            echo "ref_name=$INPUT_COMMIT" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${INPUT_BRANCH:-main}"
            echo "Using branch: $BRANCH"
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "ref_type=branch" >> "$GITHUB_OUTPUT"
            echo "ref_name=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Validate branch exists
        if: github.event.inputs.commit == ''
        env:
          BRANCH_NAME: ${{ steps.checkout-ref.outputs.ref_name }}
        run: |
          echo "Validating branch '$BRANCH_NAME' exists..."

          # Fetch all branches to ensure we have the latest
          git fetch --all

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            echo "✅ Branch '$BRANCH_NAME' found and is valid"
          else
            echo "❌ Error: Branch '$BRANCH_NAME' not found"
            echo "Available branches:"
            git branch -r | grep -v HEAD
            exit 1
          fi

      # Resolves whatever was checked out above (a branch's current HEAD,
      # or a commit) to an immutable SHA, so build and publish — separate
      # jobs, run minutes apart — check out the identical commit instead
      # of each independently re-resolving a branch name that could have
      # moved in between.
      - name: Resolve ref to commit SHA
        id: resolve-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build-sdk.yaml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  publish:
    needs: [validate, build]
    runs-on:
      group: gusto-ubuntu-default
    permissions:
      contents: write
      id-token: write
    # Deliberately no actions/cache and no npm ci here: this job holds
    # NPM_TOKEN, and build-sdk.yaml already produced dist/ on a separate,
    # secret-less runner. Keeping that separation means nothing this job
    # runs (npm version/publish) ever executes devDependency or plugin
    # code in the same runner as the token. A dispatch from any branch
    # writing to a cache key keyed on lockfile hash/github.sha would
    # otherwise land in main's cache scope and be restored here on a later
    # run — see validate-release-workflows.test.sh, which guards against both.
    env:
      INPUT_RC_NUMBER: ${{ needs.validate.outputs.rc_number }}
      INPUT_DRY_RUN: ${{ needs.validate.outputs.dry_run }}
      REF_TYPE: ${{ needs.validate.outputs.ref_type }}
      REF_NAME: ${{ needs.validate.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Show release info
        run: |
          echo "🚀 RC Release Information:"
          echo "Source: $REF_TYPE -> $REF_NAME"
          echo "Full Commit: $(git rev-parse HEAD)"
          echo "Short Commit: $(git rev-parse --short HEAD)"
          echo "Current Version: $(node -p "require('./package.json').version")"

          # Show commit details
          echo ""
          echo "📝 Commit Details:"
          git log -1 --pretty=format:"  Author: %an <%ae>%n  Date: %ad%n  Message: %s" --date=short

      - name: Prepare RC version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME="@gusto/embedded-react-sdk"

          # Starting RC number (from input or default to 1)
          RC_NUMBER="${INPUT_RC_NUMBER:-1}"

          # Function to check if version exists on npm
          check_version_exists() {
            local version=$1
            npm view "${PACKAGE_NAME}@${version}" version 2>/dev/null
          }

          # Find the next available RC number
          while true; do
            RC_VERSION="${CURRENT_VERSION}-rc.${RC_NUMBER}"

            echo "Checking if version $RC_VERSION exists..."

            if check_version_exists "$RC_VERSION"; then
              echo "Version $RC_VERSION already exists, incrementing to rc.$((RC_NUMBER + 1))"
              RC_NUMBER=$((RC_NUMBER + 1))
            else
              echo "Version $RC_VERSION is available!"
              break
            fi

            # Safety check to prevent infinite loops
            if [ $RC_NUMBER -gt 100 ]; then
              echo "❌ Error: RC number exceeded 100, something might be wrong"
              exit 1
            fi
          done

          echo "Publishing RC version: $RC_VERSION from $REF_TYPE: $REF_NAME"

          # Update package.json with RC version (disable git operations and lifecycle scripts)
          npm version $RC_VERSION --no-git-tag-version --ignore-scripts

          # Set environment variable for later steps
          echo "RC_VERSION=$RC_VERSION" >> $GITHUB_ENV

      - name: Publish RC version
        run: |
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            npm publish --access public --tag rc --ignore-scripts --dry-run
          else
            npm publish --access public --tag rc --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Output published version
        run: |
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            echo "✅ Dry run only — $RC_VERSION was NOT published"
          else
            echo "✅ Published RC version: $RC_VERSION"
          fi
          echo "📦 Install with: npm install @gusto/embedded-react-sdk@rc"
          echo "🔗 Or specific version: npm install @gusto/embedded-react-sdk@$RC_VERSION"
          echo "🌿 Released from $REF_TYPE: $REF_NAME"
          echo "📋 Full commit: $(git rev-parse HEAD)"
