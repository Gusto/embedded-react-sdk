name: Publish RC to NPM
on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: 'RC number (optional, will auto-increment if version exists)'
        required: false
        type: string
        default: '1'
      branch:
        description: 'Branch to release from'
        required: false
        type: string
        default: 'main'
      commit:
        description: 'Specific commit to release from (overrides branch if provided)'
        required: false
        type: string
      dry_run:
        description: 'Validate and build only — run npm publish with --dry-run'
        required: false
        type: boolean
        default: false
jobs:
  validate:
    runs-on:
      group: gusto-ubuntu-default
    permissions:
      contents: read
    # Inputs land here, validated below, before any step touches them —
    # never inline github.event.inputs.* in a run: script (shell-injectable).
    env:
      INPUT_RC_NUMBER: ${{ github.event.inputs.rc_number }}
      INPUT_BRANCH: ${{ github.event.inputs.branch }}
      INPUT_COMMIT: ${{ github.event.inputs.commit }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
    outputs:
      # Resolved commit SHA, not the raw branch/commit input — see
      # "Resolve ref to commit SHA" below for why.
      ref: ${{ steps.resolve-ref.outputs.sha }}
      ref_type: ${{ steps.checkout-ref.outputs.ref_type }}
      ref_name: ${{ steps.checkout-ref.outputs.ref_name }}
      rc_number: ${{ env.INPUT_RC_NUMBER }}
      dry_run: ${{ env.INPUT_DRY_RUN }}
    steps:
      # Untargeted on purpose: pulls validate-release-input.sh from the
      # trusted dispatch ref, not the untrusted branch/commit input, so the
      # validator can't be swapped out. Keep this before the ref-targeted
      # checkout below.
      - uses: actions/checkout@v6

      - name: Validate inputs
        run: |
          RC_NUMBER="${INPUT_RC_NUMBER:-1}"
          .github/scripts/validate-release-input.sh rc-number "$RC_NUMBER"
          .github/scripts/validate-release-input.sh boolean "${INPUT_DRY_RUN:-false}"

          if [ -n "$INPUT_COMMIT" ]; then
            .github/scripts/validate-release-input.sh commit-sha "$INPUT_COMMIT"
          else
            .github/scripts/validate-release-input.sh branch-name "${INPUT_BRANCH:-main}"
          fi

      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ -n "$INPUT_COMMIT" ]; then
            echo "Using commit: $INPUT_COMMIT"
            echo "ref=$INPUT_COMMIT" >> "$GITHUB_OUTPUT"
            echo "ref_type=commit" >> "$GITHUB_OUTPUT"
            echo "ref_name=$INPUT_COMMIT" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${INPUT_BRANCH:-main}"
            echo "Using branch: $BRANCH"
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "ref_type=branch" >> "$GITHUB_OUTPUT"
            echo "ref_name=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Validate branch exists
        if: github.event.inputs.commit == ''
        env:
          BRANCH_NAME: ${{ steps.checkout-ref.outputs.ref_name }}
        run: |
          echo "Validating branch '$BRANCH_NAME' exists..."

          # Fetch all branches to ensure we have the latest
          git fetch --all

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            echo "✅ Branch '$BRANCH_NAME' found and is valid"
          else
            echo "❌ Error: Branch '$BRANCH_NAME' not found"
            echo "Available branches:"
            git branch -r | grep -v HEAD
            exit 1
          fi

      # Pins to an immutable SHA so build and publish — separate jobs,
      # minutes apart — check out the identical commit instead of each
      # re-resolving a branch name that could move in between.
      - name: Resolve ref to commit SHA
        id: resolve-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize RC source for approval
        run: |
          {
            echo '## RC publish request'
            printf 'Source commit: `%s`\n\n' "$(git rev-parse HEAD)"
            printf 'Base version: `%s`\n\n' "$(jq -r .version package.json)"
            printf 'Starting RC number: `%s` (increments if already published)\n\n' "$INPUT_RC_NUMBER"
            printf 'Dry run: `%s`\n' "${INPUT_DRY_RUN:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    uses: ./.github/workflows/build-sdk.yaml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  publish:
    needs: [validate, build]
    concurrency:
      group: npm-rc
      cancel-in-progress: false
    environment: npm-release-rc
    # npm trusted publishing requires a GitHub-hosted runner.
    # GitHub writes run separately on Gusto's allowlisted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # No actions/cache or npm ci here — this job can request npm OIDC credentials, and
    # build-sdk.yaml already built dist/ on a separate, secret-less runner.
    # See validate-release-workflows.test.sh.
    env:
      INPUT_RC_NUMBER: ${{ needs.validate.outputs.rc_number }}
      INPUT_DRY_RUN: ${{ needs.validate.outputs.dry_run }}
      REF_TYPE: ${{ needs.validate.outputs.ref_type }}
      REF_NAME: ${{ needs.validate.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.ref }}

      # Publishing helpers come from the dispatch SHA, not the selected RC source.
      # Keep this checkout separate so a release branch cannot replace them.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: npm install --global npm@11.21.0 --ignore-scripts

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Show release info
        run: |
          echo "🚀 RC Release Information:"
          echo "Source: $REF_TYPE -> $REF_NAME"
          echo "Full Commit: $(git rev-parse HEAD)"
          echo "Short Commit: $(git rev-parse --short HEAD)"
          echo "Current Version: $(node -p "require('./package.json').version")"

          # Show commit details
          echo ""
          echo "📝 Commit Details:"
          git log -1 --pretty=format:"  Author: %an <%ae>%n  Date: %ad%n  Message: %s" --date=short

      - name: Prepare RC version
        id: rc-version
        run: bash .release-workflow/.github/scripts/prepare-rc.sh "${INPUT_RC_NUMBER:-1}"

      - name: Publish RC version
        env:
          RC_VERSION: ${{ steps.rc-version.outputs.version }}
        run: |
          if [ "$INPUT_DRY_RUN" = true ]; then
            npm publish --access public --tag rc --ignore-scripts --dry-run
          else
            npm publish --access public --tag rc --ignore-scripts
          fi
          printf 'Install with: npm install @gusto/embedded-react-sdk@%s\n' "$RC_VERSION"
